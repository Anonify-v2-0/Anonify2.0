# A self-hosted Anonify: the app and everything it depends on.
#
#   pnpm setup            # writes .env, including the two required secrets
#   docker compose up -d  # postgres, minio, migrations, then the app on :3000
#
# Nothing here needs an account anywhere. Postgres replaces Neon, MinIO replaces
# Vercel Blob, and OCR runs locally through Tesseract, so a fresh clone works
# offline once the images are built.
#
# To develop against these services with the app on the host instead, start only
# the dependencies and leave port 3000 free:
#
#   docker compose up -d postgres minio minio-init
#   pnpm db:migrate && pnpm dev
#
# The credentials below are development defaults and are deliberately obvious.
# They are safe because the ports bind to localhost only — do not reuse them for
# anything reachable from outside your machine.

name: anonify

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: anonify
      POSTGRES_PASSWORD: anonify
      POSTGRES_DB: anonify
      # Faster to start and adequate for a development database.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      # Bound to localhost so the database is not exposed on your network.
      # Override POSTGRES_PORT in .env if you already run Postgres on 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` returns before the server accepts writes on first boot, so
      # the check runs an actual query.
      test: ["CMD-SHELL", "psql -U anonify -d anonify -c 'select 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: anonify
      MINIO_ROOT_PASSWORD: anonify-dev-secret
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000" # S3 API
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001" # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Creates the bucket once MinIO is healthy, then exits. Without this the app
  # would start against a bucket that does not exist and fail on first upload.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 anonify anonify-dev-secret &&
      mc mb --ignore-existing local/anonify &&
      echo 'bucket ready: anonify'
      "
    restart: "no"

  # Schema and workflow tables, then exits. The app waits for this to succeed,
  # so a fresh `up` migrates before it serves anything.
  migrate:
    build:
      context: .
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://anonify:anonify@postgres:5432/anonify
    restart: "no"

  app:
    build:
      context: .
      target: runner
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      # Service names, not localhost: these are resolved on the compose network,
      # so a .env written for host development still works unchanged.
      DATABASE_URL: postgresql://anonify:anonify@postgres:5432/anonify
      DATABASE_DRIVER: postgres
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: anonify
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: anonify
      S3_SECRET_ACCESS_KEY: anonify-dev-secret
      S3_FORCE_PATH_STYLE: "true"

      # Required, and deliberately not defaulted. ENCRYPTION_KEY is the master
      # key for every stored document; a value committed to this file would be
      # the same value on every install. `pnpm setup` generates both.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set it in .env, or run `pnpm setup` to generate one}
      FINGERPRINT_SECRET: ${FINGERPRINT_SECRET:?set it in .env, or run `pnpm setup` to generate one}

      ANONIFY_PROFILE: ${ANONIFY_PROFILE:-self-hosted}
      ANONIFY_RATE_LIMIT_UPLOAD: ${ANONIFY_RATE_LIMIT_UPLOAD:-}
      ANONIFY_RATE_LIMIT_PROCESSING: ${ANONIFY_RATE_LIMIT_PROCESSING:-}
      ANONIFY_RATE_LIMIT_EXPORT: ${ANONIFY_RATE_LIMIT_EXPORT:-}
      ANONIFY_RATE_LIMIT_READ: ${ANONIFY_RATE_LIMIT_READ:-}

      # Daily allowances. Unlimited on the self-hosted profile, which is the
      # default — set these only if you are running something shared. 0 is
      # unlimited; see lib/security/quota-config.ts.
      ANONIFY_QUOTA_PDF_PAGES: ${ANONIFY_QUOTA_PDF_PAGES:-}
      ANONIFY_QUOTA_DOCX_PAGES: ${ANONIFY_QUOTA_DOCX_PAGES:-}
      ANONIFY_QUOTA_XLSX_CELLS: ${ANONIFY_QUOTA_XLSX_CELLS:-}
      ANONIFY_QUOTA_IMAGES: ${ANONIFY_QUOTA_IMAGES:-}
      ANONIFY_QUOTA_UPLOADS: ${ANONIFY_QUOTA_UPLOADS:-}

      OCR_PROVIDER: ${OCR_PROVIDER:-tesseract}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}

      # Which model each engine reads with. Both are validated against a fixed
      # list at startup, so a typo here is an error with a list of the valid
      # values rather than a 404 from a CDN on the first scanned page.
      #
      #   OCR_TESSERACT_MODEL     fast | standard | best
      #   OCR_TESSERACT_LANGUAGE  eng, deu, fra, … (join with +, as in eng+deu)
      #   MISTRAL_OCR_MODEL       mistral-ocr-latest | mistral-ocr-2505
      OCR_TESSERACT_MODEL: ${OCR_TESSERACT_MODEL:-}
      OCR_TESSERACT_LANGUAGE: ${OCR_TESSERACT_LANGUAGE:-}
      MISTRAL_OCR_MODEL: ${MISTRAL_OCR_MODEL:-}

      # The volume below, so the model survives a container restart.
      #
      # It was never set, which meant the volume was mounted and then ignored:
      # the cache fell back to the working directory inside the image and every
      # restart re-downloaded the model. Harmless enough at 3 MB, and not at all
      # harmless at 13 MB per language with OCR_TESSERACT_MODEL=best.
      TESSERACT_CACHE_PATH: ${TESSERACT_CACHE_PATH:-/data/tesseract}

      # Optional. Without a key the contextual pass is skipped and pattern
      # detection, manual redaction and export all still work.
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_PRICE_INPUT_PER_MTOK: ${AI_PRICE_INPUT_PER_MTOK:-}
      AI_PRICE_OUTPUT_PER_MTOK: ${AI_PRICE_OUTPUT_PER_MTOK:-}

      # Pacing for the services this install does not own. The other direction
      # from the rate limits above: those ration callers arriving here, these
      # pace this instance arriving somewhere else, where being refused costs a
      # page of somebody's document rather than producing a tidy 429.
      #
      # The OCR pair applies only to a hosted engine. Tesseract runs in this
      # container and answers to no limit.
      ANONIFY_AI_CONCURRENCY: ${ANONIFY_AI_CONCURRENCY:-}
      ANONIFY_AI_REQUESTS_PER_MINUTE: ${ANONIFY_AI_REQUESTS_PER_MINUTE:-}
      ANONIFY_AI_MAX_ATTEMPTS: ${ANONIFY_AI_MAX_ATTEMPTS:-}
      ANONIFY_OCR_CONCURRENCY: ${ANONIFY_OCR_CONCURRENCY:-}
      ANONIFY_OCR_REQUESTS_PER_MINUTE: ${ANONIFY_OCR_REQUESTS_PER_MINUTE:-}
      ANONIFY_OCR_MAX_ATTEMPTS: ${ANONIFY_OCR_MAX_ATTEMPTS:-}

      # The gateway meters spend rather than requests, so this is the ceiling
      # that is actually there. USD per UTC day, estimated from the prices
      # above — without those it cannot be enforced and the app says so.
      ANONIFY_AI_DAILY_SPEND_USD: ${ANONIFY_AI_DAILY_SPEND_USD:-}

      # NODE_ENV is production in the image, so the cleanup endpoint refuses
      # every request that does not carry this. Leave it unset and the sweep
      # simply will not run.
      CRON_SECRET: ${CRON_SECRET:-}
    volumes:
      # Tesseract downloads its language model on first use — a few megabytes
      # for the default variant, more for `best`. Without this the download
      # repeats on every container restart, and with OCR_TESSERACT_MODEL=best
      # that is 13 MB per language, every time.
      - tesseract-cache:/data/tesseract
    restart: unless-stopped

  # Expiry sweep.
  #
  # vercel.json's cron entry is read by Vercel and by nothing else, so a
  # self-hosted install has no scheduler at all — and "temporary by default"
  # stops being true the moment nothing is deleting anything.
  #
  # Opt in, because a short-lived local install has nothing worth sweeping:
  #
  #   docker compose --profile scheduler up -d
  #
  # If you would rather not run a container for this, `pnpm cleanup` does the
  # same work directly against the database — point cron or a systemd timer at
  # it instead.
  scheduler:
    image: curlimages/curl:latest
    profiles: ["scheduler"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      # The app on the compose network. Override with host.docker.internal:3000
      # if you run the app on the host instead.
      ANONIFY_URL: ${ANONIFY_URL:-http://app:3000}
      # Needed whenever the app has one of its own, which the container image
      # always does — it runs as production, where the endpoint refuses any
      # request without a matching bearer.
      #
      # NOT declared required here, and that is the point: compose interpolates
      # the entire file before it runs anything, profiles included, so a `${VAR:?}`
      # on this opt-in service failed `up`, `down`, `logs` and `ps` for everyone
      # who had never asked for a scheduler. The check moved into the container
      # below, where it fires when you actually opt in.
      CRON_SECRET: ${CRON_SECRET:-}
      CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-900}
    extra_hosts:
      # Docker Desktop provides this name already; Linux needs it spelled out.
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "expiry sweep every $${CLEANUP_INTERVAL_SECONDS}s against $$ANONIFY_URL"
        if [ -z "$$CRON_SECRET" ]; then
          # Not fatal: pointed at a development server on the host, which has no
          # secret of its own, the endpoint accepts an unauthenticated sweep.
          # Against this compose stack it will not, so say so now rather than
          # letting the first 401 arrive 15 minutes from now.
          echo "warning: CRON_SECRET is unset. The app container runs as production" >&2
          echo "warning: and will reject every sweep. Set it in .env, or run \`pnpm setup\`." >&2
        fi
        while true; do
          # Sleep first: on a cold `up`, the app is usually not listening yet.
          sleep "$$CLEANUP_INTERVAL_SECONDS"
          if [ -n "$$CRON_SECRET" ]; then
            AUTH="Authorization: Bearer $$CRON_SECRET"
          else
            AUTH="X-Anonify-Cron: local"
          fi
          code=$$(curl -sS -m 120 -o /tmp/out -w '%{http_code}' -H "$$AUTH" "$$ANONIFY_URL/api/cron/cleanup" || echo 000)
          echo "$$(date -Iseconds) cleanup -> $$code $$(head -c 200 /tmp/out)"
          # A sweep that 401s forever is a "temporary" document that is never
          # deleted, and a status code in a log nobody reads is how that goes
          # unnoticed. Name the cause every time it happens.
          if [ "$$code" = "401" ]; then
            echo "  refused: the app requires a bearer token this scheduler does not have." >&2
            echo "  Set CRON_SECRET to the same value the app container was given." >&2
          fi
        done

volumes:
  postgres-data:
  minio-data:
  tesseract-cache:
