packages: []

allowBuilds:
  sharp: true
  unrs-resolver: true
  msw: false
  esbuild: true
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  "@swc/core": true
  cbor-extract: true
  "tesseract.js": true

# Patched versions of transitive dependencies that their parents still pin to
# vulnerable releases (`pnpm audit`). Drop an entry once the parent catches up:
# prisma pins mysql2 and deepmerge-ts, @workflow/* pin undici, nanoid and
# devalue, and exceljs pins uuid@8.
overrides:
  deepmerge-ts@<8.0.0: ^8.0.0
  devalue@<5.9.1: ^5.9.1
  mysql2@<3.23.1: ^3.23.1
  nanoid@>=4.0.0 <5.1.16: ^5.1.16
  undici@>=7.0.0 <7.29.0: ^7.29.0
  uuid@<11.1.1: ^11.1.1
