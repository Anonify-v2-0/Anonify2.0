apiVersion: v1
kind: Service
metadata:
  name: {{ include "anonify.fullname" . }}-web
  labels:
    {{- include "anonify.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  {{- with .Values.web.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "anonify.roleLabels" (dict "root" . "role" "web") | nindent 4 }}
