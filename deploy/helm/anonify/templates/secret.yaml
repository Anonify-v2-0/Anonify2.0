{{- if and (not .Values.secrets.existingSecret) .Values.secrets.generate }}
{{- /*
ENCRYPTION_KEY, FINGERPRINT_SECRET and CRON_SECRET are generated once and
read back on every upgrade: a new ENCRYPTION_KEY would make every stored
document unreadable. The Secret is a hook so it exists before the migrate
hook runs, and is kept on uninstall for the same reason.
*/ -}}
{{- $name := include "anonify.fullname" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $hex := "0123456789abcdef" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "anonify.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key := list "ENCRYPTION_KEY" "FINGERPRINT_SECRET" "CRON_SECRET" }}
  {{- if hasKey $existing $key }}
  {{ $key }}: {{ index $existing $key }}
  {{- else }}
  {{- /* 64 hex characters, as `anonify keys` prints. */}}
  {{ $key }}: {{ randAlphaNum 64 | sha256sum | b64enc }}
  {{- end }}
  {{- end }}
  {{- with .Values.database.url }}
  DATABASE_URL: {{ . | b64enc }}
  {{- end }}
  {{- with .Values.database.workflowUrl }}
  WORKFLOW_POSTGRES_URL: {{ . | b64enc }}
  {{- end }}
  {{- range $key, $value := .Values.secrets.extra }}
  {{ $key }}: {{ $value | toString | b64enc }}
  {{- end }}
{{- else if not .Values.secrets.existingSecret }}
{{- fail "Set secrets.existingSecret, or leave secrets.generate on" }}
{{- end }}
