{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "anonify.serviceAccountName" . }}
  labels:
    {{- include "anonify.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The app talks to no Kubernetes API.
automountServiceAccountToken: false
{{- end }}
