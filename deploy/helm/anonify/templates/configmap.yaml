{{- /*
Plain environment for every pod; secrets are in secret.yaml. Built as one
dictionary so a key set in `env` replaces the chart's own rather than
appearing twice.
*/ -}}
{{- $data := dict
  "DATABASE_DRIVER" "postgres"
  "ANONIFY_PROFILE" "self-hosted"
  "ANONIFY_DRAIN_SECONDS" (toString .Values.drainSeconds)
  "ANONIFY_SCHEDULER" (ternary "on" "off" .Values.worker.scheduler)
  "ANONIFY_METRICS" (ternary "on" "off" .Values.metrics.enabled)
  "STORAGE_DRIVER" .Values.storage.driver
}}
{{- with .Values.publicUrl }}
{{- $_ := set $data "ANONIFY_PUBLIC_URL" . }}
{{- end }}
{{- if eq .Values.storage.driver "s3" }}
{{- with .Values.storage.s3 }}
{{- $_ := set $data "S3_BUCKET" .bucket }}
{{- $_ := set $data "S3_REGION" .region }}
{{- with .endpoint }}{{ $_ := set $data "S3_ENDPOINT" . }}{{ end }}
{{- $_ := set $data "S3_FORCE_PATH_STYLE" (toString .forcePathStyle) }}
{{- $_ := set $data "S3_PRESIGNED_UPLOADS" (toString .presignedUploads) }}
{{- with .publicEndpoint }}{{ $_ := set $data "S3_PUBLIC_ENDPOINT" . }}{{ end }}
{{- end }}
{{- else if eq .Values.storage.driver "azure-blob" }}
{{- with .Values.storage.azure }}
{{- with .account }}{{ $_ := set $data "AZURE_STORAGE_ACCOUNT" . }}{{ end }}
{{- $_ := set $data "AZURE_STORAGE_CONTAINER" .container }}
{{- end }}
{{- else }}
{{- fail (printf "storage.driver must be s3 or azure-blob, not %q: web and worker pods need shared storage" .Values.storage.driver) }}
{{- end }}
{{- range $name, $value := .Values.env }}
{{- $_ := set $data $name (toString $value) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "anonify.fullname" . }}
  labels:
    {{- include "anonify.labels" . | nindent 4 }}
data:
  {{- range $name, $value := $data }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
