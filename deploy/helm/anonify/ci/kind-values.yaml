# The chart on kind, against deploy/helm/test/dependencies.yaml (#191). Small
# enough for a CI runner, and quick to scale: workers start at zero and KEDA
# wakes one for the first document, which is what the smoke test then sends.
database:
  url: postgresql://anonify:anonify@postgres.deps:5432/anonify

storage:
  driver: s3
  s3:
    bucket: anonify
    region: us-east-1
    endpoint: http://rustfs.deps:9000
    forcePathStyle: true

secrets:
  extra:
    S3_ACCESS_KEY_ID: anonify
    S3_SECRET_ACCESS_KEY: anonify-dev-secret

env:
  # The smoke test exercises formats a demo profile would ration.
  ANONIFY_PROFILE: self-hosted

web:
  replicas: 1
  autoscaling:
    enabled: false
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { cpu: "1", memory: 1Gi }

worker:
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "2", memory: 3Gi }
  autoscaling:
    maxReplicas: 2
    keda:
      minReplicas: 0
      pollingInterval: 5
      cooldownPeriod: 60

metrics:
  enabled: true
