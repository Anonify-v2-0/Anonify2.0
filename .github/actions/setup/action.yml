name: Setup workspace
description: >-
  Installs Node and pnpm, restores the pnpm store cache, and installs
  dependencies.

inputs:
  node-version:
    description: Node.js version
    required: false
    default: "22"

runs:
  using: composite
  steps:
    # No `version` here on purpose: package.json's `packageManager` field is the
    # single source of truth, and it pins an exact version so CI installs with
    # the same pnpm as a developer's machine. Specifying both makes the action
    # refuse outright ("Multiple versions of pnpm specified").
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false

    # Caches the pnpm content-addressable store, keyed on the lockfile. This is
    # the cache that matters: with a warm store, install is mostly linking.
    - name: Install Node
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    # node_modules is deliberately NOT cached on top of this.
    #
    # It is 1,977 MB across 138,741 files — sharp, pdfjs-dist, tesseract.js,
    # @napi-rs/canvas and the AWS SDK are all large. Archiving that, uploading
    # it, then downloading and extracting it in each of five parallel jobs costs
    # far more than the install it replaces, and a ~2 GB entry per cache key
    # eats most of the 10 GB a repository gets.
    #
    # A warm-store install of this project takes ~18s, postinstall included.
    # Measure before adding a cache here.
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline

    # postinstall generates the Prisma client and copies the pdf.js worker, so
    # both exist by this point. Nothing further is needed.
