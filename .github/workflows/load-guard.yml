name: Load guard

# A guard against throughput regressions (#242): every night, and by hand,
# the split topology with one 2-vCPU worker takes a small steady load against
# the stub provider, and the run fails if documents a minute fell more than
# 20% below the stored baseline (benchmarks/results/load-baseline.json), or if
# any document was lost.
#
# Not on pull requests: a shared runner is too noisy for a 20% threshold, and
# the run takes minutes. Until a baseline is committed the guard reports and
# passes; each run's result is kept as an artifact, and a few of them make the
# baseline:
#
#   gh run download <run-id> -n load-guard-<run-id>     # for each of a few runs
#   pnpm load:guard --write-baseline load-*.json
#
# Widen the threshold (`--threshold 0.3` there) if the nightly noise needs it.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: load-guard
  cancel-in-progress: false

jobs:
  guard:
    name: Steady load, one worker
    # Forks have no use for a nightly load run on their own minutes.
    if: github.event_name == 'workflow_dispatch' || github.repository == 'Anonify-v2-0/Anonify2.0'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Placeholders, as in ci.yml's Compose jobs; the stack is destroyed with
      # the runner.
      ENCRYPTION_KEY: "deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
      FINGERPRINT_SECRET: "feedfacefeedfacefeedfacefeedfacefeedfacefeedfacefeedfacefeedface"
      ANONIFY_IMAGE: anonify-app:load
      ANONIFY_PULL_POLICY: never
      COMPOSE_PROJECT_NAME: anonify
      COMPOSE_FILE: docker-compose.yml:docker-compose.split.yml:docker-compose.load.yml
      # One worker unit, as the baseline measured it.
      LOAD_WORKER_CPUS: "2"
      LOAD_WORKER_MEMORY: 4g

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      # The same layer cache as ci.yml's image build, so a night with no
      # dependency change rebuilds only the source.
      - uses: docker/setup-buildx-action@v4
      - name: Build the app image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          load: true
          tags: ${{ env.ANONIFY_IMAGE }}
          cache-from: type=gha,scope=runner

      - name: Build the upload files
        run: |
          pnpm corpus:unpack
          pnpm load fixtures

      - name: Start the stack
        run: docker compose up -d --wait --scale worker=1

      - name: Steady load
        run: |
          pnpm load steady http://127.0.0.1:3000 --stub --docker anonify \
            --workers 1 --worker-cpus "$LOAD_WORKER_CPUS" --worker-memory "$LOAD_WORKER_MEMORY" \
            --reviewers 4 --duration 300 --warmup 60 \
            --label runner=github-ubuntu-latest \
            --out "load-steady-${{ github.run_id }}.json"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: load-guard-${{ github.run_id }}
          path: load-steady-${{ github.run_id }}.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Compare with the baseline
        run: pnpm load:guard "load-steady-${{ github.run_id }}.json"

      - name: The stack's logs, on failure
        if: failure()
        run: docker compose logs --no-color --tail 300

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
