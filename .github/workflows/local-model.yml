name: Local model

# The provider contract, against a real model running on the runner.
#
# Every pull request tests the analysis orchestration against a scripted model
# (tests/analysis-orchestration.test.ts): deterministic, free, and able to make
# a model misbehave on cue. What it cannot show is that the adapter a
# self-hosted install actually uses still works — Ollama's OpenAI-compatible
# endpoint carrying JSON-schema output and an image attachment, parsed by the
# real schemas and accounted for. This runs tests/ollama-contract.test.ts
# against a pinned Ollama and a pinned Qwen3-VL 2B Instruct to show that.
#
# Qwen3-VL rather than Gemma 3, which this pinned first, because of how each
# reads an image. Gemma 3 scales every image to 896 x 896 before encoding it,
# so even the probe's 32 x 32 square cost about five minutes of CPU on this
# runner — past the probe's 120 s limit and Node's 300 s fetch timeout, so the
# vision tests could not pass however long they were given. Qwen3-VL encodes an
# image near its own size, and at 1.9 GB it is also the smaller download.
#
# The instruct tag, not `qwen3-vl:2b`: that tag is the thinking model, which
# writes hundreds of tokens of reasoning before every answer — minutes per call
# on a CPU, spent on output the contract never reads.
#
# Weekly rather than per pull request: a 1.9 GB model on a CPU runner is minutes
# of download and inference, and what it guards against — an Ollama or AI SDK
# change breaking the transport — does not arrive with our pull requests. It is
# also not cached: GitHub evicts a cache unused for seven days, so a weekly job
# would restore nothing and pay for the upload anyway.
#
# A second job, "Local install", takes the same model through the whole
# self-hosted stack: `docker compose up`, a document uploaded over HTTP,
# analysed by the model, redacted, exported and read back. The Compose job in
# ci.yml proves local Postgres, RustFS and Tesseract that way on every pull
# request; this is the same proof for the model, the third service, so that
# "no account anywhere" is something CI has seen rather than something the
# docs say. It configures the instance the way a scripted install would —
# `pnpm ai verify`, setup's probe without the prompts — and asserts that model
# calls were made and none failed, not what a 2B model finds.
#
# The runtime image, model tag and model digest are pinned in
# tests/fixtures/ollama/model.json. When the registry republishes the tag, the
# digest check in .github/scripts/ollama-prepare.sh fails and says so; update the digest there on purpose,
# after reading what changed, rather than having the model move underneath the
# assertions.

on:
  schedule:
    # Mondays, early UTC. GitHub's scheduler is best-effort; the minute is
    # off the hour because on-the-hour schedules are the ones it delays most.
    - cron: "17 4 * * 1"
  workflow_dispatch:
  # Also on a pull request that changes what these jobs exercise directly: the
  # pin, the suite, the provider layer and the CLI that configures it, or this
  # file. Nothing else runs them, and this workflow's first run was after it
  # had merged — and failed on a missing DATABASE_URL.
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/local-model.yml
      - .github/scripts/ollama-prepare.sh
      - tests/ollama-contract.test.ts
      - tests/fixtures/ollama/**
      - lib/ai/providers/**
      - scripts/ai.ts

permissions:
  contents: read

concurrency:
  group: local-model-${{ github.ref }}
  cancel-in-progress: true

env:
  OLLAMA_BASE_URL: http://127.0.0.1:11434
  PIN: tests/fixtures/ollama/model.json
  # A placeholder, as in ci.yml: postinstall runs `prisma generate`, and
  # prisma.config.ts refuses to load without a DATABASE_URL. The contract
  # suite mocks the Prisma client; the Compose app is given its own.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable

jobs:
  ollama:
    name: Ollama contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANONIFY_OLLAMA_TESTS: "1"
    steps:
      - uses: actions/checkout@v5

      # The runtime image and the model download while the next step installs;
      # "Wait for Ollama" joins them afterwards. A status file rather than
      # `wait`, which cannot reach across steps.
      - name: Start Ollama and pull the pinned model, in the background
        run: |
          # shellcheck disable=SC2016 # expanded by the inner bash, on purpose
          nohup bash -c 'status=0; bash "$1" > "$2.log" 2>&1 || status=$?; echo "$status" > "$2.status"' \
            _ .github/scripts/ollama-prepare.sh "$RUNNER_TEMP/ollama" >/dev/null 2>&1 &

      - uses: ./.github/actions/setup

      - name: Wait for Ollama
        timeout-minutes: 35
        run: |
          until [ -s "$RUNNER_TEMP/ollama.status" ]; do sleep 2; done
          cat "$RUNNER_TEMP/ollama.log"
          exit "$(cat "$RUNNER_TEMP/ollama.status")"

      - name: Contract suite
        run: pnpm exec vitest run tests/ollama-contract.test.ts

      - name: Show what Ollama said
        if: failure()
        run: |
          df -h /
          if docker container inspect ollama >/dev/null 2>&1; then
            docker logs --tail 300 ollama
          else
            echo "The Ollama container never started."
            cat "$RUNNER_TEMP/ollama.log" 2>/dev/null || true
          fi

  install:
    name: Local install
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # The compose file refuses to start without these. Workflow placeholders,
      # as in ci.yml; this stack is destroyed at the end of the job.
      ENCRYPTION_KEY: "deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
      FINGERPRINT_SECRET: "feedfacefeedfacefeedfacefeedfacefeedfacefeedfacefeedfacefeedface"
    steps:
      - uses: actions/checkout@v5

      - name: Start Ollama and pull the pinned model, in the background
        run: |
          # shellcheck disable=SC2016 # expanded by the inner bash, on purpose
          nohup bash -c 'status=0; bash "$1" > "$2.log" 2>&1 || status=$?; echo "$status" > "$2.status"' \
            _ .github/scripts/ollama-prepare.sh "$RUNNER_TEMP/ollama" >/dev/null 2>&1 &

      - uses: ./.github/actions/setup

      # Also independent of the model, so it overlaps the download too.
      - name: Build the stack's images
        run: docker compose build

      - name: Wait for Ollama
        timeout-minutes: 35
        run: |
          until [ -s "$RUNNER_TEMP/ollama.status" ]; do sleep 2; done
          cat "$RUNNER_TEMP/ollama.log"
          exit "$(cat "$RUNNER_TEMP/ollama.status")"

      # What an operator does without a terminal: choose the provider, then
      # verify the model, which writes its capability declaration into .env.
      # OLLAMA_BASE_URL stays in the job's environment, so the host (here) and
      # the container (through host.docker.internal) name the same server, and
      # the declaration is bound to that name. Compose reads the rest of .env.
      - name: Configure the instance for the pinned local model
        run: |
          set -euo pipefail
          echo 'AI_PROVIDER=ollama' > .env
          pnpm ai verify --model "$(jq -r .model "$PIN")"
          pnpm ai status
          grep '^AI_' .env

      - name: Start the stack
        run: docker compose up -d --wait

      - name: Upload, analyse with the model, redact, export, download
        run: |
          ANONIFY_SMOKE_AI_MODEL="ollama:$(jq -r .model "$PIN")" \
            pnpm smoke --ai http://127.0.0.1:3000

      - name: Show what the containers said
        if: failure()
        run: |
          df -h /
          docker compose logs --no-color --timestamps
          docker logs --tail 300 ollama 2>/dev/null || cat "$RUNNER_TEMP/ollama.log" 2>/dev/null || true

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
