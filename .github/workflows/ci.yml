name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # An escape hatch: re-runs everything unconditionally, past the decisions below.
  workflow_dispatch:

# A newer push to the same ref makes the running checks irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # `decide` asks which pull request a commit came from, and which files a pull
  # request touches.
  pull-requests: read

env:
  # Placeholders, not secrets. Nothing here reaches a real service:
  #
  #  - DATABASE_URL is only parsed. Every route is dynamic and the Prisma client
  #    connects lazily, so the build never opens a connection.
  #  - ENCRYPTION_KEY has to decode to 32 bytes. It used to be 64 zeroes, and
  #    unquoted YAML reads that as the integer zero — so the container was handed
  #    the string "0". Nothing caught it for a long time: the crypto suites
  #    generate their own random keys, and the compose stack was the first thing
  #    to encrypt anything with the configured one. Quoted now, and hex with
  #    letters in it, which no YAML parser can turn into a number.
  #
  # Deliberately NOT set, and the reason matters:
  #
  #  - BLOB_READ_WRITE_TOKEN — its presence switches lib/storage/blob.ts from
  #    the local filesystem driver to Vercel Blob, which would send the storage
  #    tests at a real bucket they have no credentials for.
  #  - AI_GATEWAY_API_KEY — absent, aiConfigured() is false and the analysis
  #    layer short-circuits, so CI can never make a billable model call.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
  ENCRYPTION_KEY: "deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
  FINGERPRINT_SECRET: "feedfacefeedfacefeedfacefeedfacefeedfacefeedfacefeedfacefeedface"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # Everything below is gated on this job, which answers one question: is there
  # anything here the checks have not already seen?
  #
  # Two ways the answer is no.
  #
  # A merge into main is the first. The pull request that produced it was built,
  # tested and booted on exactly the tree that is now main — a squash or merge
  # commit has the same content as the head that passed. Re-running is a second
  # opinion from the same machine on the same bytes. Rather than guess from the
  # commit message, this asks the API which pull requests claim the commit as
  # their merge, which is true for squash and merge-commit alike. A hand-pushed
  # commit to main belongs to no pull request and is checked in full.
  #
  # A change that no check can read is the second. `pnpm build` does not compile
  # README.md and the compose stack does not boot .vscode. The list below is an
  # allow-list of things to ignore and is deliberately short: anything not named
  # in it — including this workflow, the Dockerfile, lockfiles and package.json —
  # counts as source and runs everything.
  decide:
    name: Decide
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      why: ${{ steps.decide.outputs.why }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EVENT: ${{ github.event_name }}
      SHA: ${{ github.sha }}
      BEFORE: ${{ github.event.before }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - id: decide
        run: |
          set -uo pipefail

          decision() {
            echo "run=$1"   >> "$GITHUB_OUTPUT"
            echo "why=$2"   >> "$GITHUB_OUTPUT"
            echo "::notice::$2"
            echo "$2"       >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          run_ci()  { decision true  "Running the checks — $1"; }
          skip_ci() { decision false "Skipping the checks — $1"; }

          if [ "$EVENT" = "workflow_dispatch" ]; then
            run_ci "asked for by hand."
          fi

          # 1. A push to main that is a pull request main has already checked.
          if [ "$EVENT" = "push" ]; then
            merged=$(gh api "repos/$REPO/commits/$SHA/pulls" \
                       --jq "[.[] | select(.merge_commit_sha == \"$SHA\")] | .[0].number" 2>/dev/null) || merged=""
            if [ -n "$merged" ] && [ "$merged" != "null" ]; then
              skip_ci "$SHA is the merge of #$merged, which was checked on the pull request."
            fi
          fi

          # 2. Nothing changed that any check can read.
          case "$EVENT" in
            pull_request)
              files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' 2>/dev/null) || files=""
              ;;
            push)
              if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                run_ci "a new branch, with nothing to compare against."
              fi
              # `compare` reports at most 300 files; past that `files` is
              # truncated and the answer would be a guess, so `truncated` sends
              # this to the fallback below.
              files=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" \
                        --jq 'if (.files | length) >= 300 then "truncated" else .files[].filename end' 2>/dev/null) || files=""
              ;;
            *)
              run_ci "an event this job does not know how to narrow down."
              ;;
          esac

          if [ -z "$files" ] || [ "$files" = "truncated" ]; then
            run_ci "the changed files could not be listed."
          fi

          ignorable() {
            case "$1" in
              *.md) return 0 ;;
              docs/*) return 0 ;;
              LICENSE|LICENSE.*|NOTICE|AUTHORS|CODEOWNERS) return 0 ;;
              .gitignore|.gitattributes|.editorconfig) return 0 ;;
              .vscode/*|.idea/*) return 0 ;;
              .github/ISSUE_TEMPLATE/*) return 0 ;;
              *) return 1 ;;
            esac
          }

          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if ! ignorable "$f"; then
              run_ci "$f is source."
            fi
          done <<< "$files"

          skip_ci "only documentation and editor files changed."

  # The checks below are independent and run as concurrent jobs rather than as
  # sequential steps: the slowest is the compose stack, so the wall clock is that
  # one job instead of the sum of all of them. None of them gates on an install
  # job, which would serialize the graph for a cache they already share.
  lint:
    name: Lint
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm run lint

  typecheck:
    name: Typecheck
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm run typecheck

  test:
    name: Test
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # The suites cover real files end to end — PDF extraction and
      # rasterization, OOXML surgery, workbook rewriting, pixel redaction — plus
      # the adversarial pass that tries to recover redacted values from each
      # exported artifact.
      - name: Test
        run: pnpm run test

      # The labelled corpus under benchmarks/corpus is synthetic, and this is
      # what keeps it that way: every email, phone number, URL and IP address
      # in a committed corpus file must be in a range reserved for fiction or
      # documentation, and every label must match its text. See
      # benchmarks/README.md.
      - name: Corpus holds no real identifiers
        run: pnpm run corpus:check

  # The real Tesseract engine, against committed fixture images, asserting where
  # its boxes land and not only what it read: OCR spans are what the image
  # canvas and the exporter both place redactions from.
  #
  # Its own job so `test` stays offline. The model is pinned by URL and hash in
  # tests/fixtures/ocr/model.json and cached under that hash, so the network is
  # touched once per model rather than once per run, and a model that changed
  # underneath us fails the checksum rather than moving the boxes.
  # ANONIFY_OCR_TESTS makes the suites fail, not skip, if the model is missing.
  ocr:
    name: OCR
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TESSERACT_CACHE_PATH: ${{ github.workspace }}/.cache/tesseract
      ANONIFY_OCR_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Restore the pinned OCR model
        id: model
        uses: actions/cache@v5
        with:
          path: .cache/tesseract
          key: tesseract-${{ hashFiles('tests/fixtures/ocr/model.json') }}

      - name: Fetch the pinned OCR model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          model=tests/fixtures/ocr/model.json
          file="$TESSERACT_CACHE_PATH/$(jq -r .language "$model").traineddata"
          mkdir -p "$TESSERACT_CACHE_PATH"
          curl -fsSL --retry 3 "$(jq -r .source "$model")" | gunzip > "$file"
          echo "$(jq -r .sha256 "$model")  $file" | sha256sum --check -

      - name: OCR suites
        run: pnpm exec vitest run tests/image-ocr.test.ts tests/pdf-ocr.test.ts

  build:
    name: Build
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # Turbopack's build cache. Keyed on the lockfile plus the sources, with a
      # prefix restore so an unrelated source change still starts from the
      # previous build's cache instead of from nothing.
      - name: Restore build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: >-
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{
            hashFiles('app/**', 'components/**', 'lib/**', 'store/**',
            'types/**', 'hooks/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      - name: Build
        run: pnpm run build

  # Proves a fresh clone can actually stand the schema up. `db push` would hide
  # a broken migration by rebuilding from the schema instead of replaying it.
  migrations:
    name: Migrations
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: anonify
          POSTGRES_PASSWORD: anonify
          POSTGRES_DB: anonify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anonify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://anonify:anonify@localhost:5432/anonify
      DATABASE_DRIVER: postgres
      # Replayed into and dropped by the drift check below; never the real one.
      SHADOW_DATABASE_URL: postgresql://anonify:anonify@localhost:5432/shadow

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Apply migrations to an empty database
        run: pnpm db:migrate:deploy

      - name: Create the shadow database
        run: psql "$DATABASE_URL" -c 'create database shadow'

      - name: Fail if the schema and migrations disagree
        # Catches a schema.prisma edit without a matching migration.
        run: |
          pnpm exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code

  # The database-backed suites: expiry cleanup and quota accounting.
  #
  # These are integration tests in the honest sense — they assert on what is
  # durable at each moment, which is exactly what a fake cannot tell you.
  # Deletion ordering, a unique constraint standing in for a mutex, an
  # increment that has to be atomic under concurrency: every one of those
  # passes against a mock and fails against Postgres if the code is wrong.
  #
  # The schema is replayed from the migrations into an empty database, so this
  # also proves a fresh clone can stand the schema up and then use it.
  database:
    name: Database tests
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: anonify
          POSTGRES_PASSWORD: anonify
          POSTGRES_DB: anonify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anonify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # The optional store for the cluster-wide AI and OCR budget (#184).
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://anonify:anonify@localhost:5432/anonify_test
      TEST_DATABASE_URL: postgresql://anonify:anonify@localhost:5432/anonify_test
      TEST_REDIS_URL: redis://localhost:6379
      DATABASE_DRIVER: postgres
      # The suites write objects; the local filesystem driver keeps that on the
      # runner rather than pointed at anything real.
      STORAGE_DRIVER: local

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Apply migrations to an empty database
        run: pnpm db:migrate:deploy

      - name: Cleanup and quota suites
        run: pnpm test:db

  # Boots the whole self-hosted stack and redacts a real document through it.
  #
  # This runs on every pull request rather than only on Dockerfile changes,
  # because the bugs it catches are not Docker bugs. Every failure this has
  # found so far came from ordinary application code meeting the container:
  # file tracing shipping sharp's binding without the libvips it dlopens, the
  # workflow world resolved by a runtime `require` no bundler follows, an
  # environment variable that silently defaults to a database nobody runs.
  # Unit tests pass through all of them.
  compose:
    name: Compose stack
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # The compose file refuses to start without these, deliberately — see the
      # comment on the `app` service. The values are the workflow placeholders
      # above; this stack is destroyed at the end of the job.
      ENCRYPTION_KEY: "deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
      FINGERPRINT_SECRET: "feedfacefeedfacefeedfacefeedfacefeedfacefeedfacefeedfacefeedface"
      # The images built below, with cached layers, which compose then starts
      # as they are instead of building again.
      ANONIFY_IMAGE: anonify-app:ci
      # The app and its migrations on a read-only root filesystem, with only
      # /tmp and /data writable (#178). Every `docker compose` below without
      # its own -f list uses both files.
      COMPOSE_FILE: docker-compose.yml:docker-compose.readonly.yml

    steps:
      - uses: actions/checkout@v5

      # The smoke test is TypeScript and builds its own fixtures, so it needs
      # the workspace. It does not need the app — that is running in a container.
      - uses: ./.github/actions/setup

      # The image build was most of this job, from scratch every time (#172).
      # Buildx keeps every layer in the Actions cache, so a run whose lockfile
      # has not changed reuses the dependency install, and one whose source has
      # not changed reuses the build too. The runner's scope is `mode=max`, so
      # the builder stage is cached as well as the final image.
      - uses: docker/setup-buildx-action@v4

      - name: Build the app image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          load: true
          tags: ${{ env.ANONIFY_IMAGE }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,scope=runner,mode=max

      # One image does every job (#175): the stack's `migrate` service is this
      # image running `anonify migrate`.
      - name: The image's commands
        run: |
          docker run --rm "$ANONIFY_IMAGE" help | grep -q "migrate" \
            || { echo "::error::anonify help does not list its commands"; exit 1; }
          set +e
          docker run --rm "$ANONIFY_IMAGE" migrat
          status=$?
          set -e
          [ "$status" = 64 ] || { echo "::error::an unknown command exited $status, not 64"; exit 1; }
          docker run --rm "$ANONIFY_IMAGE" node -e "process.exit(0)" \
            || { echo "::error::a command naming a program did not run as given"; exit 1; }
          docker image inspect "$ANONIFY_IMAGE" --format 'image size: {{.Size}} bytes'

      # The hardening (#178): tini as PID 1, a stop that is prompt, the labels,
      # and the baked OCR model reading a scan with no network at all.
      - name: The image is hardened
        run: |
          pid1=$(docker run --rm "$ANONIFY_IMAGE" sh -c 'cat /proc/1/comm')
          [ "$pid1" = tini ] || { echo "::error::PID 1 is $pid1, not tini"; exit 1; }

          docker run -d --name stop-check "$ANONIFY_IMAGE" node -e "setInterval(() => {}, 1000)"
          started=$(date +%s)
          docker stop -t 20 stop-check
          took=$(( $(date +%s) - started ))
          docker rm stop-check
          [ "$took" -lt 5 ] || { echo "::error::SIGTERM took ${took}s to stop the container"; exit 1; }

          licence=$(docker image inspect "$ANONIFY_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}')
          [ "$licence" = Apache-2.0 ] || { echo "::error::the licence label is '$licence'"; exit 1; }

          # A line of text, drawn here where there are fonts, read in there
          # where there is no network.
          node -e "
            const { createCanvas } = require('@napi-rs/canvas')
            const canvas = createCanvas(700, 140)
            const context = canvas.getContext('2d')
            context.fillStyle = '#fff'
            context.fillRect(0, 0, 700, 140)
            context.fillStyle = '#000'
            context.font = '56px sans-serif'
            context.fillText('OFFLINE SCAN 2026', 24, 92)
            require('fs').writeFileSync('ocr-check.png', canvas.toBuffer('image/png'))"
          docker run --rm --network none -v "$PWD/ocr-check.png:/tmp/ocr-check.png:ro" -w /app "$ANONIFY_IMAGE" node -e "
            // From the store path the server itself loads it by: the top-level
            // copy in the standalone tree cannot resolve its own dependencies.
            const { createWorker } = require(require('fs').globSync('/app/node_modules/.pnpm/tesseract.js@*/node_modules/tesseract.js')[0])
            ;(async () => {
              const worker = await createWorker('eng', undefined, { cachePath: process.env.TESSERACT_BAKED_PATH })
              const { data } = await worker.recognize('/tmp/ocr-check.png')
              await worker.terminate()
              console.log('read: ' + data.text.trim())
              process.exit(/OFFLINE/.test(data.text) ? 0 : 1)
            })().catch((error) => { console.error(error); process.exit(1) })"

      - name: Start the stack
        # --wait blocks until postgres and RustFS report healthy, the bucket and
        # migration jobs have exited successfully, and the app answers
        # /api/ready: database, storage and workflow worker. Reaching the next
        # step at all is most of the assertion.
        run: docker compose up -d --wait

      # ANONIFY_PUBLIC_URL is read per request, not baked at build (#168): the
      # image above was built without it, and the page must still name it.
      - name: Link previews use the address set at run time
        env:
          ANONIFY_PUBLIC_URL: https://anonify.ci.example
        run: |
          docker compose up -d --wait app
          curl -fsS http://127.0.0.1:3000/ | grep -q 'content="https://anonify.ci.example/Anonify.jpeg"' \
            || { echo "::error::The landing page does not resolve og:image against ANONIFY_PUBLIC_URL"; exit 1; }

      - name: Re-run bucket initialization
        run: docker compose run --rm rustfs-init

      # Every deploy runs it, so a second run against a migrated database has
      # to find nothing to do and say so with exit 0.
      - name: Migrate again, as the next deploy would
        run: docker compose run --rm migrate

      # The sweep as a job, with the app's configuration and no server.
      - name: Run the expiry sweep from the image
        run: docker compose run --rm --no-deps app cleanup

      - name: Upload, download, list, presign and delete through RustFS
        run: pnpm smoke:storage http://127.0.0.1:9000

      # Every supported format, each opened afterwards the way an adversary
      # would: a CSV reparsed as a grid, a message reparsed with an independent
      # MIME library, a deck unzipped and its notes and master read, an image's
      # pixels sampled. Asserting a 200 here would prove only that the request
      # was answered.
      - name: Upload, process, export, download — every format
        run: pnpm smoke http://127.0.0.1:3000

      # The app sweeps on its own timer, with no scheduler service (#183): a
      # document made to expire is gone after a short interval.
      - name: The app sweeps expired documents itself
        env:
          ANONIFY_SCHEDULER_INTERVAL_SECONDS: "10"
        run: |
          docker compose up -d --wait --force-recreate app
          sql() { docker compose exec -T postgres psql -U anonify -d anonify -tAc "$1"; }
          id=$(sql 'select id from "Document" where "parentDocumentId" is null order by "createdAt" desc limit 1')
          [ -n "$id" ] || { echo "::error::no document to expire"; exit 1; }
          sql "update \"Document\" set \"expiresAt\" = now() - interval '1 minute' where id = '$id'"
          for attempt in $(seq 1 30); do
            left=$(sql "select count(*) from \"Document\" where id = '$id'")
            [ "$left" = 0 ] && break
            sleep 2
          done
          [ "$left" = 0 ] || { echo "::error::the expired document was not swept"; exit 1; }
          docker compose logs app | grep -q '"context":"scheduler","leader":true' \
            || { echo "::error::the sweep did not log its leader line"; exit 1; }

      # Stopping a container drains it (#182): readiness drops while health
      # stays up, and the process exits 0 once the sequence has finished.
      - name: A stopped app drains, then exits cleanly
        run: |
          docker compose stop app &
          stopping=$!
          sleep 1
          ready=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/ready)
          health=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health)
          wait $stopping
          [ "$ready" = 503 ] && [ "$health" = 200 ] \
            || { echo "::error::while draining, ready answered $ready and health $health"; exit 1; }
          code=$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -aq app)")
          [ "$code" = 0 ] || { echo "::error::the app exited $code"; docker compose logs app | tail -20; exit 1; }
          docker compose logs app | grep -q '"context":"shutdown","phase":"done"' \
            || { echo "::error::the drain did not finish"; exit 1; }
          docker compose up -d --wait app

      # The runner delivers steps through a relay inside the process, with a
      # token nobody outside it knows (#179). A delivery posted to the port,
      # however well-formed, is a route that does not exist.
      - name: Workflow routes refuse deliveries from outside the process
        run: |
          for route in step flow; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'content-type: application/json' \
              -H "x-vqs-queue-name: __wkf_${route}_smoke" \
              -H 'x-vqs-message-id: msg_smoke' \
              -H 'x-vqs-message-attempt: 1' \
              --data '{}' "http://127.0.0.1:3000/.well-known/workflow/v1/${route}")
            [ "$code" = 404 ] || { echo "::error::POST /.well-known/workflow/v1/${route} from outside answered $code"; exit 1; }
          done

      # Direct uploads to RustFS (#185). Without a CORS rule a browser could
      # not PUT to the bucket, and /api/ready says so under `degraded` while
      # staying 200; with one, it does not. Then a document through a
      # presigned PUT. The rule is kept for five minutes, hence the recreate.
      - name: Presigned uploads to RustFS, and the CORS readiness check
        env:
          S3_PRESIGNED_UPLOADS: "true"
          S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
          AWS_ACCESS_KEY_ID: anonify
          AWS_SECRET_ACCESS_KEY: anonify-dev-secret
          AWS_DEFAULT_REGION: us-east-1
        run: |
          s3api="aws s3api --endpoint-url http://127.0.0.1:9000"
          $s3api delete-bucket-cors --bucket anonify
          docker compose up -d --wait --force-recreate app
          curl -fsS http://127.0.0.1:3000/api/ready | tee ready.json
          jq -e '.status == "ready" and (.degraded | index("presigned-cors"))' ready.json >/dev/null \
            || { echo "::error::a bucket without CORS was not reported as degraded"; exit 1; }
          docker compose logs app | grep -q 'no CORS rules' \
            || { echo "::error::the readiness warning does not say what is missing"; exit 1; }

          $s3api put-bucket-cors --bucket anonify --cors-configuration \
            '{"CORSRules":[{"AllowedOrigins":["http://localhost:3000"],"AllowedMethods":["PUT"],"AllowedHeaders":["content-type"]}]}'
          docker compose up -d --wait --force-recreate app
          curl -fsS http://127.0.0.1:3000/api/ready | tee ready.json
          jq -e '.status == "ready" and .degraded == null and (.checks | has("presigned-cors"))' ready.json >/dev/null \
            || { echo "::error::a bucket with the CORS rule was still reported"; exit 1; }

          pnpm smoke http://127.0.0.1:3000 --only=txt | tee smoke.log
          grep -q 'straight to storage' smoke.log \
            || { echo "::error::the smoke did not upload straight to the bucket"; exit 1; }

      # Serving and processing in separate containers (#179): the app as the
      # web role, and two workers with no published port.
      - name: Split roles, one web and two workers
        run: |
          split="-f docker-compose.yml -f docker-compose.readonly.yml -f docker-compose.split.yml"
          docker compose $split up -d --wait
          docker compose $split logs app | grep -q '"worker":false' \
            || { echo "::error::the web container did not report its role"; exit 1; }
          started=$(docker compose $split logs worker | grep -c '"worker":true')
          [ "$started" = 2 ] || { echo "::error::$started of 2 workers started their runner"; exit 1; }

          # The web container executes no step. With the workers stopped, a
          # document it accepts stays queued; started again, they finish it.
          latest() {
            docker compose $split exec -T postgres psql -U anonify -d anonify -tAc \
              'select status from "Document" order by "createdAt" desc limit 1'
          }
          docker compose $split stop worker
          timeout 45 pnpm smoke http://127.0.0.1:3000 --only=txt || true
          status=$(latest)
          [ "$status" = queued ] || { echo "::error::with no worker running, a document went to '$status'"; exit 1; }
          docker compose $split start worker
          for attempt in $(seq 1 60); do
            status=$(latest)
            [ "$status" = ready ] && break
            sleep 2
          done
          [ "$status" = ready ] || { echo "::error::the workers left the queued document '$status'"; exit 1; }

          pnpm smoke http://127.0.0.1:3000

          # A worker serves its probes and nothing a person would ask for.
          for container in $(docker compose $split ps -q worker); do
            docker exec "$container" node -e "
              const get = (path) => fetch('http://127.0.0.1:3000' + path).then((r) => r.status)
              Promise.all(['/', '/api/documents', '/api/health'].map(get)).then((codes) => {
                console.log(codes.join(' '))
                process.exit(codes.join() === '404,404,200' ? 0 : 1)
              })"
          done

      # The same stack on Azure Blob Storage, with Azurite (#176): the driver's
      # own smoke from the host, which also creates the container, then every
      # format through the app with browser uploads going to a SAS URL.
      - name: Azure Blob Storage, through Azurite
        env:
          STORAGE_DRIVER: azure-blob
          AZURE_STORAGE_CONTAINER: anonify
          AZURE_STORAGE_PRESIGNED_UPLOADS: "true"
          AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
        run: |
          azure="-f docker-compose.yml -f docker-compose.readonly.yml -f docker-compose.azure.yml"
          docker compose $azure up -d azurite
          for attempt in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:10000/ && break
            sleep 1
          done
          pnpm smoke:driver --create-container
          # Back to one app container, on Azure; the split's workers go.
          docker compose $azure up -d --wait --remove-orphans
          pnpm smoke http://127.0.0.1:3000

      - name: Show what the containers said
        if: failure()
        # The overrides name the workers and Azurite too, whether or not they ran.
        run: docker compose -f docker-compose.yml -f docker-compose.readonly.yml -f docker-compose.split.yml -f docker-compose.azure.yml logs --no-color --timestamps

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.readonly.yml -f docker-compose.split.yml -f docker-compose.azure.yml down --volumes --remove-orphans

  # A pull request that moves the version owes a line saying what moved.
  #
  # Deliberately not gated on `decide`. A pull request labelled `bug` that only
  # edits documentation still cuts a patch release, and `decide` would have
  # skipped this and let it ship with nothing written down. The check costs one
  # API call, so there is no reason to make it conditional.
  #
  # It asks `scripts/release-labels.mjs` — the same file `release.yml` asks — so
  # "needs a fragment" and "produces a release" cannot drift apart.
  changelog:
    name: Changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: A pull request that releases needs a changelog fragment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          pass() { echo "::notice::$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; exit 0; }

          # The release workflow's own bump pull request carries the assembled
          # changelog and the deletion of the fragments that made it. Asking it
          # for a fragment would be asking it to undo its own work.
          case "$HEAD_REF" in
            release/*) pass "#$PR is a release bump; the changelog is in it already." ;;
          esac

          bump=$(node scripts/release-labels.mjs --labels "$LABELS" --field bump)

          if [ "$bump" = "none" ]; then
            pass "#$PR moves no version, so it needs no changelog fragment."
          fi

          added=$(gh api --paginate "repos/$REPO/pulls/$PR/files" \
                    --jq '.[] | select(.status != "removed") | .filename' \
                  | grep -E '^changelog\.d/.+\.(added|changed|deprecated|removed|fixed|security)\.md$' || true)

          if [ -n "$added" ]; then
            pass "#$PR is a $bump and carries: $(printf '%s' "$added" | tr '\n' ' ')"
          fi

          echo "::error::#$PR is a $bump release and has no changelog fragment. Add changelog.d/$PR.<section>.md — one line saying what changed for someone running Anonify. Sections: added, changed, deprecated, removed, fixed, security. See changelog.d/README.md. If this change is invisible to anyone running it, drop the version-bumping label instead."
          exit 1

  # A single check to require in branch protection, so adding a job above does
  # not mean editing the protected-branch settings.
  #
  # This one is never gated on `decide` — branch protection waits for a required
  # check to arrive, so a skipped run still has to report. A `skipped` job is not
  # a failure here: `decide` already established there was nothing to check.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs:
      [
        decide,
        lint,
        typecheck,
        test,
        ocr,
        build,
        migrations,
        database,
        compose,
        changelog,
      ]
    if: always()
    steps:
      - name: Report
        run: |
          echo "decide:     ${{ needs.decide.result }} — ${{ needs.decide.outputs.why }}"
          echo "lint:       ${{ needs.lint.result }}"
          echo "typecheck:  ${{ needs.typecheck.result }}"
          echo "test:       ${{ needs.test.result }}"
          echo "ocr:        ${{ needs.ocr.result }}"
          echo "build:      ${{ needs.build.result }}"
          echo "migrations: ${{ needs.migrations.result }}"
          echo "database:   ${{ needs.database.result }}"
          echo "compose:    ${{ needs.compose.result }}"
          echo "changelog:  ${{ needs.changelog.result }}"

          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more checks failed."
            exit 1
          fi
