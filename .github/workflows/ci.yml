name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # An escape hatch: re-runs everything unconditionally, past the decisions below.
  workflow_dispatch:

# A newer push to the same ref makes the running checks irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # `decide` asks which pull request a commit came from, and which files a pull
  # request touches.
  pull-requests: read

env:
  # Placeholders, not secrets. Nothing here reaches a real service:
  #
  #  - DATABASE_URL is only parsed. Every route is dynamic and the Prisma client
  #    connects lazily, so the build never opens a connection.
  #  - ENCRYPTION_KEY has to decode to 32 bytes. It used to be 64 zeroes, and
  #    unquoted YAML reads that as the integer zero — so the container was handed
  #    the string "0". Nothing caught it for a long time: the crypto suites
  #    generate their own random keys, and the compose stack was the first thing
  #    to encrypt anything with the configured one. Quoted now, and hex with
  #    letters in it, which no YAML parser can turn into a number.
  #
  # Deliberately NOT set, and the reason matters:
  #
  #  - BLOB_READ_WRITE_TOKEN — its presence switches lib/storage/blob.ts from
  #    the local filesystem driver to Vercel Blob, which would send the storage
  #    tests at a real bucket they have no credentials for.
  #  - AI_GATEWAY_API_KEY — absent, aiConfigured() is false and the analysis
  #    layer short-circuits, so CI can never make a billable model call.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
  ENCRYPTION_KEY: "deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
  FINGERPRINT_SECRET: "feedfacefeedfacefeedfacefeedfacefeedfacefeedfacefeedfacefeedface"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # Everything below is gated on this job, which answers one question: is there
  # anything here the checks have not already seen?
  #
  # Two ways the answer is no.
  #
  # A merge into main is the first. The pull request that produced it was built,
  # tested and booted on exactly the tree that is now main — a squash or merge
  # commit has the same content as the head that passed. Re-running is a second
  # opinion from the same machine on the same bytes. Rather than guess from the
  # commit message, this asks the API which pull requests claim the commit as
  # their merge, which is true for squash and merge-commit alike. A hand-pushed
  # commit to main belongs to no pull request and is checked in full.
  #
  # A change that no check can read is the second. `pnpm build` does not compile
  # README.md and the compose stack does not boot .vscode. The list below is an
  # allow-list of things to ignore and is deliberately short: anything not named
  # in it — including this workflow, the Dockerfile, lockfiles and package.json —
  # counts as source and runs everything.
  decide:
    name: Decide
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      why: ${{ steps.decide.outputs.why }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EVENT: ${{ github.event_name }}
      SHA: ${{ github.sha }}
      BEFORE: ${{ github.event.before }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - id: decide
        run: |
          set -uo pipefail

          decision() {
            echo "run=$1"   >> "$GITHUB_OUTPUT"
            echo "why=$2"   >> "$GITHUB_OUTPUT"
            echo "::notice::$2"
            echo "$2"       >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          run_ci()  { decision true  "Running the checks — $1"; }
          skip_ci() { decision false "Skipping the checks — $1"; }

          if [ "$EVENT" = "workflow_dispatch" ]; then
            run_ci "asked for by hand."
          fi

          # 1. A push to main that is a pull request main has already checked.
          if [ "$EVENT" = "push" ]; then
            merged=$(gh api "repos/$REPO/commits/$SHA/pulls" \
                       --jq "[.[] | select(.merge_commit_sha == \"$SHA\")] | .[0].number" 2>/dev/null) || merged=""
            if [ -n "$merged" ] && [ "$merged" != "null" ]; then
              skip_ci "$SHA is the merge of #$merged, which was checked on the pull request."
            fi
          fi

          # 2. Nothing changed that any check can read.
          case "$EVENT" in
            pull_request)
              files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' 2>/dev/null) || files=""
              ;;
            push)
              if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                run_ci "a new branch, with nothing to compare against."
              fi
              # `compare` reports at most 300 files; past that `files` is
              # truncated and the answer would be a guess, so `truncated` sends
              # this to the fallback below.
              files=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" \
                        --jq 'if (.files | length) >= 300 then "truncated" else .files[].filename end' 2>/dev/null) || files=""
              ;;
            *)
              run_ci "an event this job does not know how to narrow down."
              ;;
          esac

          if [ -z "$files" ] || [ "$files" = "truncated" ]; then
            run_ci "the changed files could not be listed."
          fi

          ignorable() {
            case "$1" in
              *.md) return 0 ;;
              docs/*) return 0 ;;
              LICENSE|LICENSE.*|NOTICE|AUTHORS|CODEOWNERS) return 0 ;;
              .gitignore|.gitattributes|.editorconfig) return 0 ;;
              .vscode/*|.idea/*) return 0 ;;
              .github/ISSUE_TEMPLATE/*) return 0 ;;
              *) return 1 ;;
            esac
          }

          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if ! ignorable "$f"; then
              run_ci "$f is source."
            fi
          done <<< "$files"

          skip_ci "only documentation and editor files changed."

  # The checks below are independent and run as concurrent jobs rather than as
  # sequential steps: the slowest is the compose stack, so the wall clock is that
  # one job instead of the sum of all of them. None of them gates on an install
  # job, which would serialize the graph for a cache they already share.
  lint:
    name: Lint
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm run lint

  typecheck:
    name: Typecheck
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm run typecheck

  test:
    name: Test
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # The suites cover real files end to end — PDF extraction and
      # rasterization, OOXML surgery, workbook rewriting, pixel redaction — plus
      # the adversarial pass that tries to recover redacted values from each
      # exported artifact.
      - name: Test
        run: pnpm run test

  build:
    name: Build
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # Turbopack's build cache. Keyed on the lockfile plus the sources, with a
      # prefix restore so an unrelated source change still starts from the
      # previous build's cache instead of from nothing.
      - name: Restore build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: >-
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{
            hashFiles('app/**', 'components/**', 'lib/**', 'store/**',
            'types/**', 'hooks/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      - name: Build
        run: pnpm run build

  # Proves a fresh clone can actually stand the schema up. `db push` would hide
  # a broken migration by rebuilding from the schema instead of replaying it.
  migrations:
    name: Migrations
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: anonify
          POSTGRES_PASSWORD: anonify
          POSTGRES_DB: anonify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anonify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://anonify:anonify@localhost:5432/anonify
      DATABASE_DRIVER: postgres
      # Replayed into and dropped by the drift check below; never the real one.
      SHADOW_DATABASE_URL: postgresql://anonify:anonify@localhost:5432/shadow

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Apply migrations to an empty database
        run: pnpm db:migrate:deploy

      - name: Create the shadow database
        run: psql "$DATABASE_URL" -c 'create database shadow'

      - name: Fail if the schema and migrations disagree
        # Catches a schema.prisma edit without a matching migration.
        run: |
          pnpm exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code

  # The database-backed suites: expiry cleanup and quota accounting.
  #
  # These are integration tests in the honest sense — they assert on what is
  # durable at each moment, which is exactly what a fake cannot tell you.
  # Deletion ordering, a unique constraint standing in for a mutex, an
  # increment that has to be atomic under concurrency: every one of those
  # passes against a mock and fails against Postgres if the code is wrong.
  #
  # The schema is replayed from the migrations into an empty database, so this
  # also proves a fresh clone can stand the schema up and then use it.
  database:
    name: Database tests
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: anonify
          POSTGRES_PASSWORD: anonify
          POSTGRES_DB: anonify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anonify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://anonify:anonify@localhost:5432/anonify_test
      TEST_DATABASE_URL: postgresql://anonify:anonify@localhost:5432/anonify_test
      DATABASE_DRIVER: postgres
      # The suites write objects; the local filesystem driver keeps that on the
      # runner rather than pointed at anything real.
      STORAGE_DRIVER: local

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Apply migrations to an empty database
        run: pnpm db:migrate:deploy

      - name: Cleanup and quota suites
        run: pnpm test:db

  # Boots the whole self-hosted stack and redacts a real document through it.
  #
  # This runs on every pull request rather than only on Dockerfile changes,
  # because the bugs it catches are not Docker bugs. Every failure this has
  # found so far came from ordinary application code meeting the container:
  # file tracing shipping sharp's binding without the libvips it dlopens, the
  # workflow world resolved by a runtime `require` no bundler follows, an
  # environment variable that silently defaults to a database nobody runs.
  # Unit tests pass through all of them.
  compose:
    name: Compose stack
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # The compose file refuses to start without these, deliberately — see the
      # comment on the `app` service. The values are the workflow placeholders
      # above; this stack is destroyed at the end of the job.
      ENCRYPTION_KEY: "deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
      FINGERPRINT_SECRET: "feedfacefeedfacefeedfacefeedfacefeedfacefeedfacefeedfacefeedface"

    steps:
      - uses: actions/checkout@v5

      # The smoke test is TypeScript and builds its own fixtures, so it needs
      # the workspace. It does not need the app — that is running in a container.
      - uses: ./.github/actions/setup

      - name: Build and start the stack
        # --wait blocks until postgres and RustFS report healthy, the bucket and
        # migration jobs have exited successfully, and the app's own healthcheck
        # passes. Reaching the next step at all is most of the assertion.
        run: docker compose up -d --build --wait

      - name: Re-run bucket initialization
        run: docker compose run --rm rustfs-init

      - name: Upload, download, list, presign and delete through RustFS
        run: pnpm smoke:storage http://127.0.0.1:9000

      # Every supported format, each opened afterwards the way an adversary
      # would: a CSV reparsed as a grid, a message reparsed with an independent
      # MIME library, a deck unzipped and its notes and master read, an image's
      # pixels sampled. Asserting a 200 here would prove only that the request
      # was answered.
      - name: Upload, process, export, download — every format
        run: pnpm smoke http://127.0.0.1:3000

      - name: Show what the containers said
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans

  # A pull request that moves the version owes a line saying what moved.
  #
  # Deliberately not gated on `decide`. A pull request labelled `bug` that only
  # edits documentation still cuts a patch release, and `decide` would have
  # skipped this and let it ship with nothing written down. The check costs one
  # API call, so there is no reason to make it conditional.
  #
  # It asks `scripts/release-labels.mjs` — the same file `release.yml` asks — so
  # "needs a fragment" and "produces a release" cannot drift apart.
  changelog:
    name: Changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: A pull request that releases needs a changelog fragment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          pass() { echo "::notice::$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; exit 0; }

          # The release workflow's own bump pull request carries the assembled
          # changelog and the deletion of the fragments that made it. Asking it
          # for a fragment would be asking it to undo its own work.
          case "$HEAD_REF" in
            release/*) pass "#$PR is a release bump; the changelog is in it already." ;;
          esac

          bump=$(node scripts/release-labels.mjs --labels "$LABELS" --field bump)

          if [ "$bump" = "none" ]; then
            pass "#$PR moves no version, so it needs no changelog fragment."
          fi

          added=$(gh api --paginate "repos/$REPO/pulls/$PR/files" \
                    --jq '.[] | select(.status != "removed") | .filename' \
                  | grep -E '^changelog\.d/.+\.(added|changed|deprecated|removed|fixed|security)\.md$' || true)

          if [ -n "$added" ]; then
            pass "#$PR is a $bump and carries: $(printf '%s' "$added" | tr '\n' ' ')"
          fi

          echo "::error::#$PR is a $bump release and has no changelog fragment. Add changelog.d/$PR.<section>.md — one line saying what changed for someone running Anonify. Sections: added, changed, deprecated, removed, fixed, security. See changelog.d/README.md. If this change is invisible to anyone running it, drop the version-bumping label instead."
          exit 1

  # A single check to require in branch protection, so adding a job above does
  # not mean editing the protected-branch settings.
  #
  # This one is never gated on `decide` — branch protection waits for a required
  # check to arrive, so a skipped run still has to report. A `skipped` job is not
  # a failure here: `decide` already established there was nothing to check.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs:
      [
        decide,
        lint,
        typecheck,
        test,
        build,
        migrations,
        database,
        compose,
        changelog,
      ]
    if: always()
    steps:
      - name: Report
        run: |
          echo "decide:     ${{ needs.decide.result }} — ${{ needs.decide.outputs.why }}"
          echo "lint:       ${{ needs.lint.result }}"
          echo "typecheck:  ${{ needs.typecheck.result }}"
          echo "test:       ${{ needs.test.result }}"
          echo "build:      ${{ needs.build.result }}"
          echo "migrations: ${{ needs.migrations.result }}"
          echo "database:   ${{ needs.database.result }}"
          echo "compose:    ${{ needs.compose.result }}"
          echo "changelog:  ${{ needs.changelog.result }}"

          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more checks failed."
            exit 1
          fi
